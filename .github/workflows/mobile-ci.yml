name: Mobile CI

on:
  push:
    branches: [main, mobile/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core-tests:
    name: handy-core unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: handy-core-${{ matrix.os }}
      - name: cargo test handy-core
        run: cargo test -p handy-core --lib --all-features
      - name: cargo test handy-platform
        run: cargo test -p handy-platform --lib --all-features

  android-cross-compile:
    name: Cross-compile handy-core to Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          local-cache: true
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-cross
      - name: Probe NDK clang wrapper (diagnostic)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -x
          ls -la "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/" | head -40
          file "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" || true
          head -10 "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" || true
      - name: cargo ndk check (aarch64 + armv7)
        env:
          # Override runner-bundled NDK (27.x) with the action-installed r26d
          # so cargo-ndk doesn't warn about the mismatch and uses our pinned one.
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # cargo-ndk 4.x parses `-p 24` after `-t ...` as a positional that
          # collides with cargo's `--package`. Use `ANDROID_PLATFORM` instead,
          # which cargo-ndk reads as the API level (=minSdkVersion).
          export ANDROID_PLATFORM=24
          cargo ndk -t arm64-v8a -t armeabi-v7a -- check -p handy-core
          cargo ndk -t arm64-v8a -t armeabi-v7a -- check -p handy-platform

  desktop-no-regression:
    name: Desktop build still works
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.os }}
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-layer-shell-dev \
            libasound2-dev
      - name: cargo check src-tauri
        working-directory: src-tauri
        run: cargo check --lib
