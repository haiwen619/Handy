name: Mobile CI

on:
  push:
    branches: [main, mobile/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core-tests:
    name: handy-core unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: handy-core-${{ matrix.os }}
      - name: cargo test handy-core
        run: cargo test -p handy-core --lib --all-features
      - name: cargo test handy-platform
        run: cargo test -p handy-platform --lib --all-features

  android-cross-compile:
    name: Cross-compile handy-core to Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          local-cache: true
      - name: Configure cargo + cc-rs for NDK
        run: |
          NDK_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "${NDK_BIN}/aarch64-linux-android24-clang"
          ar     = "${NDK_BIN}/llvm-ar"

          [target.armv7-linux-androideabi]
          linker = "${NDK_BIN}/armv7a-linux-androideabi24-clang"
          ar     = "${NDK_BIN}/llvm-ar"
          EOF

          # cc-rs reads CC_<target_underscored> and AR_<target_underscored>.
          # libsqlite3-sys + similar build.rs crates need these to find a C compiler
          # that knows about the Android API level. The underscore form is required.
          {
            echo "CC_aarch64_linux_android=${NDK_BIN}/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=${NDK_BIN}/llvm-ar"
            echo "CXX_aarch64_linux_android=${NDK_BIN}/aarch64-linux-android24-clang++"
            echo "CC_armv7_linux_androideabi=${NDK_BIN}/armv7a-linux-androideabi24-clang"
            echo "AR_armv7_linux_androideabi=${NDK_BIN}/llvm-ar"
            echo "CXX_armv7_linux_androideabi=${NDK_BIN}/armv7a-linux-androideabi24-clang++"
            echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-cross
      - name: cargo check handy-core for aarch64-linux-android
        run: cargo check -p handy-core --target aarch64-linux-android

      - name: cargo check handy-platform for aarch64-linux-android
        run: cargo check -p handy-platform --target aarch64-linux-android

      - name: cargo check handy-core for armv7-linux-androideabi
        run: cargo check -p handy-core --target armv7-linux-androideabi

      - name: cargo check handy-platform for armv7-linux-androideabi
        run: cargo check -p handy-platform --target armv7-linux-androideabi

  desktop-no-regression:
    name: Desktop build still works
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.os }}
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-layer-shell-dev \
            libasound2-dev
      - name: cargo check src-tauri
        working-directory: src-tauri
        run: cargo check --lib
