name: Mobile CI

on:
  push:
    branches: [main, mobile/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core-tests:
    name: handy-core unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: handy-core-${{ matrix.os }}
      - name: cargo test handy-core
        run: cargo test -p handy-core --lib --all-features
      - name: cargo test handy-platform
        run: cargo test -p handy-platform --lib --all-features

  android-cross-compile:
    name: Cross-compile handy-core to Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-cross
      - name: Resolve runner-bundled NDK
        run: |
          # Use the NDK preinstalled on ubuntu-latest (27.3+). The
          # nttld/setup-ndk@v1 download of r26d ships incomplete clang
          # wrappers that exec a non-existent `clang` symlink, breaking
          # cc-rs. The bundled NDK has a complete toolchain.
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            # Fallback: pick the highest-numbered SDK ndk dir
            NDK=$(ls -d /usr/local/lib/android/sdk/ndk/*/ 2>/dev/null | sort -V | tail -1)
            NDK="${NDK%/}"
          fi
          echo "Using NDK at: $NDK"
          ls "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/" | grep -E '^(clang|aarch64-linux-android)' | head -10
          {
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_NDK_ROOT=$NDK"
          } >> "$GITHUB_ENV"
      - name: cargo ndk check (aarch64 + armv7)
        env:
          ANDROID_PLATFORM: "24"
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -- check -p handy-core
          cargo ndk -t arm64-v8a -t armeabi-v7a -- check -p handy-platform

  desktop-no-regression:
    name: Desktop build still works
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.os }}
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-layer-shell-dev \
            libasound2-dev
      - name: cargo check src-tauri
        working-directory: src-tauri
        run: cargo check --lib
